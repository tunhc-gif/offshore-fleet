name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Project page (https://<user>.github.io/<repo>/) needs basePath=/<repo>.
      # A user/org page (repo named <user>.github.io) or custom domain needs it empty.
      - name: Derive base path
        id: base
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          # AI Agent LLM layer: set repo Variable AI_PROXY_URL (Settings →
          # Secrets and variables → Actions → Variables) to your deployed
          # Cloudflare Worker URL. Empty/unset ⇒ AI Agent stays offline/rule-based.
          NEXT_PUBLIC_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

      # SPA fallback so deep links to not-yet-generated paths still load.
      - run: cp out/index.html out/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
